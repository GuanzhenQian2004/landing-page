<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Steven Qian">
  <!-- Editorial monogram: off-white canvas, warm near-black ink, one pastel orb.
       Square by design — Sveltia uses this for the login screen and favicon. -->
  <defs>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a7e5d3" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#a7e5d3" stop-opacity="0" />
    </radialGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="96" ry="96" />
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="#f5f5f5" />
    <circle cx="392" cy="132" r="190" fill="url(#orb)" />
    <text
      x="256"
      y="256"
      fill="#0c0a09"
      font-family="'EB Garamond', 'Times New Roman', serif"
      font-size="268"
      font-weight="300"
      letter-spacing="-8"
      text-anchor="middle"
      dominant-baseline="central"
    >SQ</text>
  </g>
  <rect x="0.5" y="0.5" width="511" height="511" rx="96" ry="96" fill="none" stroke="#e7e5e4" />
</svg>
