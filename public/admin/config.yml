backend:
  name: github
  repo: GuanzhenQian2004/landing-page
  branch: main
  # Auth relay — the Cloudflare Worker you deploy during setup (see README).
  base_url: https://sveltia-cms-auth.stevenqian2004.workers.dev

# Where uploaded images go, and how they're referenced in markdown.
media_folder: public/assets/projects
public_folder: /assets/projects

site_url: https://stevenqian.com
display_url: https://stevenqian.com

# Branding on the login screen, header, and browser tab.
app_title: Steven Qian
logo:
  src: /admin/logo.svg

collections:
  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    create: true
    delete: true
    slug: '{{slug}}'
    extension: md
    format: yaml-frontmatter
    summary: '{{title}} — {{dateLabel}}'
    sortable_fields: [date, title]
    view_groups:
      - label: Featured
        field: featured
    fields:
      - label: Title
        name: title
        widget: string
        hint: The project name, shown on the card and the project page.

      - label: Short summary
        name: summary
        widget: text
        required: false
        hint: One or two sentences. Shown on the card and under the title.

      - label: Organization
        name: organization
        widget: string
        required: false
        hint: Company, club, or school this was built for.

      - label: Your role
        name: role
        widget: string
        required: false
        hint: 'e.g. Machine Learning Engineer, Data Pipeline Developer.'

      - label: Date label
        name: dateLabel
        widget: string
        required: false
        hint: 'Shown on the page, e.g. "August 2024 – Present".'

      - label: Sort date
        name: date
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: true
        hint: Used only for ordering — newest projects appear first.

      - label: Featured on home page
        name: featured
        widget: boolean
        default: false
        required: false

      # --- Media ---------------------------------------------------------
      - label: Cover image
        name: cover
        widget: image
        required: false
        allow_multiple: false
        hint: Shown on the card and at the top of the project page (16:10 works best).

      - label: Video
        name: video
        widget: string
        required: false
        hint: >-
          Optional. Paste a YouTube or Vimeo link, or upload an .mp4 to
          public/assets/projects and enter /assets/projects/yourfile.mp4.
          A video replaces the cover image at the top of the page.

      - label: Gallery
        name: gallery
        widget: list
        required: false
        default: []
        label_singular: Image
        summary: '{{fields.caption}}'
        hint: Extra screenshots or photos. Click one on the site to enlarge it.
        fields:
          - label: Image
            name: src
            widget: image
          - label: Caption
            name: caption
            widget: string
            required: false

      # --- Links ---------------------------------------------------------
      - label: Live link
        name: link
        widget: string
        required: false
        pattern: ['^https?://.+', 'Must be a full URL starting with http:// or https://']
        hint: Optional. Demo, write-up, or product page.

      - label: Source code
        name: repo
        widget: string
        required: false
        pattern: ['^https?://.+', 'Must be a full URL starting with http:// or https://']
        hint: Optional. Link to the GitHub repository.

      - label: Tags
        name: tags
        widget: list
        required: false
        default: []
        hint: 'Tech used, e.g. Python, React, AWS. Press Enter after each.'

      - label: Hide this project
        name: draft
        widget: boolean
        default: false
        required: false
        hint: Turn on to remove it from the site without deleting it.

      - label: Full write-up
        name: body
        widget: markdown
        hint: >-
          The main content of the project page. Add headings, lists, links, and
          images — drag images straight into the editor to upload them.
